# Xledger test-server deployment. Uses shared Postgres from /opt/docker/postgres.
name: xledger

services:
  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  xledger-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        GOLANG_IMAGE: ${GOLANG_IMAGE:-docker.m.daocloud.io/library/golang:1.22-alpine}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["/bin/sh", "/app/backend-entrypoint.sh"]
    volumes:
      - ${BACKEND_CONFIG_FILE:-../backend/config/test.yaml}:/app/config/source-config.yaml:ro
      - ./backend-entrypoint.sh:/app/backend-entrypoint.sh:ro
    environment:
      HTTP_PROXY: ${XLEDGER_HTTP_PROXY:-http://host.docker.internal:10829}
      HTTPS_PROXY: ${XLEDGER_HTTPS_PROXY:-http://host.docker.internal:10829}
      ALL_PROXY: ${XLEDGER_ALL_PROXY:-socks5h://host.docker.internal:10828}
      NO_PROXY: ${XLEDGER_NO_PROXY:-localhost,127.0.0.1,::1,redis,xledger-backend,xledger-frontend,shared-postgres}
      http_proxy: ${XLEDGER_HTTP_PROXY:-http://host.docker.internal:10829}
      https_proxy: ${XLEDGER_HTTPS_PROXY:-http://host.docker.internal:10829}
      all_proxy: ${XLEDGER_ALL_PROXY:-socks5h://host.docker.internal:10828}
      no_proxy: ${XLEDGER_NO_PROXY:-localhost,127.0.0.1,::1,redis,xledger-backend,xledger-frontend,shared-postgres}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${XLEDGER_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - postgres-net

  xledger-frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:20-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      xledger-backend:
        condition: service_healthy
    ports:
      - "${XLEDGER_FRONTEND_PORT:-4174}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

networks:
  postgres-net:
    external: true
    name: postgres-net

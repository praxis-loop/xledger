name: E2E Spec Matrix

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "deploy/**"
      - "e2e-tests/**"
      - ".github/workflows/e2e-spec-matrix.yml"
  push:
    branches:
      - prd
    paths:
      - "frontend/**"
      - "backend/**"
      - "deploy/**"
      - "e2e-tests/**"
      - ".github/workflows/e2e-spec-matrix.yml"
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: "Regenerate visual-regression baselines and upload them as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit-tests:
    name: "unit (${{ matrix.tz }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The product timezone plus one west of UTC: date bucketing bugs only show up on the other side.
        tz: [Asia/Shanghai, America/Los_Angeles]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Backend tests
        working-directory: backend
        run: go test ./... -count=1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck and tests
        working-directory: frontend/app
        run: pnpm run check

  e2e-by-spec:
    name: "e2e (${{ matrix.spec }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: accounts
            script: e2e:accounts
          - spec: account-ledger
            script: e2e:account-ledger
          - spec: transactions
            script: e2e:transactions
          - spec: transfer
            script: e2e:transfer
          - spec: reporting
            script: e2e:reporting
          - spec: classification
            script: e2e:classification
          - spec: pat
            script: e2e:pat
          - spec: quality-visual
            script: e2e:visual
          - spec: quality-a11y
            script: e2e:a11y

    env:
      CI: "true"
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_API_BASE_URL: http://127.0.0.1:8080/api
      POSTGRES_IMAGE: postgres:16-alpine
      REDIS_IMAGE: redis:7-alpine
      GOLANG_IMAGE: golang:1.22-alpine
      NODE_IMAGE: node:20-alpine
      NGINX_IMAGE: nginx:1.27-alpine
      BACKEND_CONFIG_FILE: ../backend/config/config.yaml.example

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: e2e-tests/pnpm-lock.yaml

      - name: Install e2e dependencies
        working-directory: e2e-tests
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: ${{ !startsWith(matrix.spec, 'quality-') }}
        working-directory: e2e-tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Install quality browsers
        if: ${{ startsWith(matrix.spec, 'quality-') }}
        working-directory: e2e-tests
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Start deploy stack
        working-directory: deploy
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null && curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Services are ready"
              exit 0
            fi
            echo "Waiting for services... (${i}/60)"
            sleep 5
          done
          echo "Service startup timed out"
          docker compose -f deploy/docker-compose.yaml ps
          docker compose -f deploy/docker-compose.yaml logs --tail=200
          exit 1

      - name: Run e2e spec
        working-directory: e2e-tests
        run: pnpm run ${{ (matrix.spec == 'quality-visual' && inputs.update_visual_snapshots) && 'e2e:visual:update' || matrix.script }}

      - name: Upload regenerated visual baselines
        if: ${{ matrix.spec == 'quality-visual' && inputs.update_visual_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e-tests/e2e/quality.visual.spec.ts-snapshots
          retention-days: 7

      - name: Dump deploy logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yaml logs --tail=300

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.spec }}-artifacts
          path: |
            e2e-tests/playwright-report
            e2e-tests/test-results
            e2e-tests/midscene_run/report
            e2e-tests/midscene_run/log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop deploy stack
        if: always()
        working-directory: deploy
        run: docker compose down -v
